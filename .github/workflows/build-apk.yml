name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create Android project
        run: |
          flutter create --project-name esp32_car --org com.ishaque --platforms=android .
          cp app_src/main.dart lib/main.dart
          cp app_src/pubspec.yaml pubspec.yaml
          rm -rf test
      - name: Patch manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><application|' $M
          sed -i 's|<queries>|<queries><intent><action android:name="android.speech.RecognitionService"/></intent>|' $M
          sed -i '0,/android:label="[^"]*"/s//android:label="ESP32 Car"/' $M
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-Car-APK
          path: build/app/outputs/flutter-apk/app-release.apk
